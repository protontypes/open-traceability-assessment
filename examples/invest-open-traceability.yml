# Open Traceability manifest — InVEST (Natural Capital Project)
#
# Curated evidence set for assessing the traceability of InVEST, the open-source
# ecosystem-service modelling toolset. Run it with:
#
#   python ota.py --manifest examples/invest-open-traceability.yml --runs 3
#
# Each dimension lists the URLs that constitute the evidence for the claim, so every
# run uses the same bundle (reproducible) and includes artifacts a crawl of the repo
# alone would miss (sample data on Bitbucket, the hosted User Guide, the forum).
# Stage 6 (Open Linkage) has no section: this file *is* the linkage artifact.

claim: >
  InVEST is an open-source toolset that maps and values ecosystem services (carbon
  storage, water yield, pollination, coastal protection, and more) to support
  environmental decision-making, with model outputs intended to be credible and
  reproducible.
claim_url: https://github.com/natcap/invest

# Namespace: the organization / project home behind the claim. Its other repositories
# and profile are general context for every dimension (governance, identity, scope).
namespace: https://github.com/natcap

# Stage 1 — Open Input Data and Measurement Evidence
open_data:
  - url: https://bitbucket.org/natcap/invest-sample-data
    note: Versioned sample input datasets covering every InVEST model.
  - url: https://naturalcapitalalliance.stanford.edu/software/invest/invest-downloads-data
    note: Official downloads page listing InVEST data sources and guidance.

# Stage 2 — Open-Source Models, Methods, and Software
open_software:
  - url: https://github.com/natcap/invest
    note: Main InVEST toolset source, Apache-2.0 licensed.
  - url: https://github.com/natcap/pygeoprocessing
    note: PyGeoprocessing — the geospatial processing library InVEST depends on.
  - url: https://github.com/natcap/taskgraph
    note: TaskGraph — the workflow engine all InVEST models use to organise execution.

# Stage 3 — Open Execution and Reproducibility
open_execution:
  - url: https://github.com/natcap/invest/blob/main/.github/workflows/build-and-test.yml
    note: CI workflow that builds and tests InVEST on every change.
  - url: https://invest.readthedocs.io/en/latest/installing.html
    note: Documented, versioned install procedure for reproducing the environment.

# Stage 4 — Open Community and Review
open_community:
  - url: https://github.com/natcap/invest/issues
    note: Public issue tracker where bugs are reported, discussed, and corrected.
  - url: https://community.naturalcapitalalliance.org/
    note: Community forum for user support and model questions.

# Stage 5 — Open Publications and Communication
# ("open_access" is also accepted as a heading and maps here)
open_publications:
  - url: https://storage.googleapis.com/releases.naturalcapitalproject.org/invest-userguide/latest/en/index.html
    note: InVEST User Guide — the canonical documentation of models, methods, and data needs.
  - url: https://github.com/natcap/invest/releases
    note: Versioned releases with changelogs, tying outputs to specific software versions.
